<title>AI Cafe Surabaya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell — asisten + filter di kiri, peta kota + daftar tempat di kanan; tumpuk satu kolom di HP */
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --sunk:#E3E9E5; --ink:#15201C; --muted:#5B6B64; --line:#D3DCD7;
  --kali:#0E6B5A; --kali-soft:#D5EBE4; --kopi:#7A4A2B; --kopi-soft:#F1E4DA; --star:#C98A00;
  --sea:#CFE3EA; --land:#F6F8F6; --river:#8EC3D3;
  --open:#1F8A4C; --closed:#B23A2E;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --c-cafe:#0E6B5A; --c-warkop:#7A4A2B; --c-kedai:#B2591E; --c-resto:#8A2F45; --c-stk:#3F5AA8;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1614; --surface:#18221F; --sunk:#111A17; --ink:#E7EFEB; --muted:#93A59D; --line:#2A3833;
  --kali:#4FC2A6; --kali-soft:#173A32; --kopi:#D9A27B; --kopi-soft:#3A2A20; --star:#F2B705;
  --sea:#13303A; --land:#1B2622; --river:#2E6A7C; --open:#4CC47F; --closed:#F07A6C;
  --c-cafe:#4FC2A6; --c-warkop:#D9A27B; --c-kedai:#F0954E; --c-resto:#E57A96; --c-stk:#8FA6F0;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1614; --surface:#18221F; --sunk:#111A17; --ink:#E7EFEB; --muted:#93A59D; --line:#2A3833;
  --kali:#4FC2A6; --kali-soft:#173A32; --kopi:#D9A27B; --kopi-soft:#3A2A20; --star:#F2B705;
  --sea:#13303A; --land:#1B2622; --river:#2E6A7C; --open:#4CC47F; --closed:#F07A6C;
  --c-cafe:#4FC2A6; --c-warkop:#D9A27B; --c-kedai:#F0954E; --c-resto:#E57A96; --c-stk:#8FA6F0;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1360px;margin:0 auto;padding-inline:16px;padding-block:18px 40px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--kali);outline-offset:2px}

header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:12px;background:var(--kali);display:grid;place-items:center;color:var(--surface)}
.brand h1{font-family:var(--display);font-size:22px;font-weight:700;margin:0;letter-spacing:-.01em}
.brand h1 span{color:var(--kopi)}
.brand p{margin:0;color:var(--muted);font-size:13px}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--kali)}
.btn.primary{background:var(--kali);border-color:var(--kali);color:var(--surface)}
.btn.primary:hover{filter:brightness(1.08)}

.layout{display:grid;grid-template-columns:360px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}

/* Asisten */
.assist{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.assist-head{padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--open);box-shadow:0 0 0 4px color-mix(in srgb,var(--open) 20%,transparent)}
.assist-head b{font-size:14px}
.assist-head small{color:var(--muted);margin-left:auto;font-size:12px}
.chat{max-height:300px;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:92%;padding:10px 12px;border-radius:12px;font-size:14px}
.msg.ai{background:var(--sunk);align-self:flex-start;border-top-left-radius:4px}
.msg.me{background:var(--kali);color:var(--surface);align-self:flex-end;border-top-right-radius:4px}
.msg .pick{display:block;margin-top:6px;font-weight:600;color:var(--kali);cursor:pointer;background:none;border:0;padding:0;text-align:left}
.msg .pick:hover{text-decoration:underline}
.msg .tagline{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.msg .tagline span{font-size:11px;background:var(--surface);border:1px solid var(--line);padding:1px 7px;border-radius:99px}
.ask{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.ask input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px}
.suggest{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 14px}
.suggest button{border:1px dashed var(--line);background:transparent;border-radius:99px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--muted)}
.suggest button:hover{border-color:var(--kali);color:var(--kali)}

/* Filter */
.filters{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:16px}
.fgroup{display:flex;flex-direction:column;gap:8px}
.flabel{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;display:flex;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:5px 11px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 4px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
select,input[type=time],input[type=range]{width:100%}
select,input[type=time]{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px}
input[type=range]{accent-color:var(--kali)}
.reset{align-self:flex-start;background:none;border:0;color:var(--kali);font-weight:600;cursor:pointer;padding:0;font-size:13px}

/* Main */
.mapcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.map-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.map-head b{font-size:14px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.mapbox{position:relative;background:var(--sea)}
#map{display:block;width:100%;height:auto;max-width:100%}
#map .pin{cursor:pointer;transition:r .15s}
#map .pin:hover{stroke-width:3}
#map .pin.sel{stroke:var(--ink);stroke-width:3}
#map text{font-family:var(--body);fill:var(--muted)}
.maptip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:4px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-130%)}

.results-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:20px 0 10px;flex-wrap:wrap}
.results-head h2{font-family:var(--display);font-size:18px;font-weight:500;margin:0}
.results-head h2 em{font-style:normal;color:var(--kali)}
.sortbox{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.sortbox select{width:auto}
.active-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.active-filters span{font-size:12px;background:var(--kali-soft);color:var(--kali);padding:3px 9px;border-radius:99px;font-weight:600}

.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;min-width:0}
.card:hover{border-color:var(--kali)}
.card.sel{border-color:var(--kali);box-shadow:0 0 0 2px var(--kali-soft)}
.card-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card h3{margin:0;font-size:15.5px;line-height:1.3;text-wrap:balance}
.cat{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:6px;white-space:nowrap;color:var(--surface)}
.meta{display:flex;flex-wrap:wrap;gap:10px;font-size:13px;color:var(--muted);align-items:center}
.stars{color:var(--star);font-weight:700;font-variant-numeric:tabular-nums}
.status{font-weight:700;font-size:12px}
.status.on{color:var(--open)} .status.off{color:var(--closed)}
.addr{font-size:13px;color:var(--muted);margin:0}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tags span{font-size:11px;background:var(--sunk);padding:2px 7px;border-radius:6px;color:var(--muted)}
.dist{font-family:var(--mono);font-size:12px;color:var(--kali)}
.empty{grid-column:1/-1;background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--muted)}

/* Detail drawer */
.detail{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 40%,transparent);display:flex;justify-content:flex-end;z-index:50}
.sheet{background:var(--surface);width:min(460px,100%);height:100%;overflow-y:auto;padding:22px 20px calc(30px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;padding-top:calc(22px + env(safe-area-inset-top,0px))}
.sheet h2{font-family:var(--display);font-size:22px;font-weight:700;margin:0;line-height:1.2;text-wrap:balance}
.close{align-self:flex-end;border:1px solid var(--line);background:var(--bg);border-radius:10px;width:36px;height:36px;cursor:pointer;font-size:18px}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.mono{font-family:var(--mono);font-size:13px}
.hours{width:100%;border-collapse:collapse;font-size:13px}
.hours td{padding:5px 0;border-bottom:1px solid var(--line)}
.hours td:last-child{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.hours tr.today td{font-weight:700;color:var(--kali)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions .btn{justify-content:center;padding:11px}
.note{font-size:12px;color:var(--muted);background:var(--kopi-soft);border-radius:10px;padding:10px 12px}
.note b{color:var(--kopi)}
.minimap{border-radius:12px;overflow:hidden;border:1px solid var(--line)}

.disclaimer{margin-top:22px;font-size:12.5px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.disclaimer b{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;z-index:60}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  <div class="layout">

        <div class="fgroup">

          <select id="fArea" aria-label="Wilayah"></select>

          <select id="fNear" aria-label="Titik acuan"></select>
          <input type="range" id="fRadius" min="1" max="15" step="1" value="5" aria-label="Radius km">

        <div class="fgroup">
          <div class="flabel">Fasilitas & suasana</div>
          <div class="chips" id="fTags"></div>
        </div>
        <div class="fgroup">
          <div class="flabel">Harga</div>
          <div class="seg" id="fPrice"></div>
        </div>
        <button class="reset" id="resetBtn" type="button">Hapus semua filter</button>
      </section>
    </aside>

    <main style="min-width:0">
      <section class="mapcard" aria-label="Peta Surabaya">
        <div class="map-head">
          <b>Peta Surabaya</b>
          <div class="legend" id="legend"></div>
        </div>
        <div class="mapbox" id="mapbox">
          <svg id="map" viewBox="0 0 600 440" role="img" aria-label="Sebaran tempat di peta Surabaya"></svg>
          <div class="maptip" id="maptip" hidden></div>
        </div>
      </section>

      <div class="results-head">
        <h2><em id="count">0</em> tempat cocok</h2>
        <label class="sortbox">Urutkan
          <select id="fSort">
            <option value="rating">Rating tertinggi</option>
            <option value="reviews">Ulasan terbanyak</option>
            <option value="dist">Terdekat</option>
            <option value="name">Nama A–Z</option>
          </select>
        </label>
      </div>
      <div class="active-filters" id="activeFilters"></div>
      <div class="list" id="list"></div>

      <p class="disclaimer" id="disclaimer"></p>
    </main>
  </div>
</div>

<div class="detail" id="detail" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dName" id="sheet"></div>
</div>
<div class="toast" id="toast" hidden></div>

/* ---------- Normalisasi data ---------- */
const toMin = s => {const [h,m]=String(s).split(":").map(Number);return h*60+(m||0)};
const fmt = m => {m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")};
function areaOf(lat,lng){
  if(lat>-7.245) return "Utara";
  if(lng<112.705) return "Barat";
  if(lng>112.765) return "Timur";
  if(lat<-7.300) return "Selatan";
  return "Pusat";
}
function normalize(p,i){
  const q = {...p};
  q.id = q.id || "p"+i;
  q.category = CATS[q.category] ? q.category : "cafe";
  q.area = q.area || areaOf(q.lat,q.lng);
  q.tags = q.tags || [];
  q.rating = q.rating==null?null:Number(q.rating); q.reviews = Number(q.reviews)||0; q.address = q.address||"";
  if(!Array.isArray(q.periods)){
    q.periods = [];
    if(q.open!=null){
      const o=toMin(q.open), c=toMin(q.close);
      if(o===0 && (c===1440||c===0) && q.close!=="00:00" || (q.open==="00:00"&&q.close==="24:00")){q.periods=[[0,WEEK]];}
      else for(let d=0;d<7;d++){const s=d*1440+o;let e=d*1440+(c<=o?c+1440:c);q.periods.push([s,e]);}
    }
  }
  q.is24 = q.periods.some(([s,e])=>e-s>=WEEK);
  if(q.is24 && !q.tags.includes("24 jam")) q.tags.push("24 jam");
  return q;
}
function isOpenAt(p,t){
  if(!p.periods.length) return null;
  return p.periods.some(([s,e])=> (t>=s&&t<e) || (t+WEEK>=s&&t+WEEK<e));
}
function hoursForDay(p,d){
  if(p.is24) return "24 jam";
  const out=[];
  for(const [s,e] of p.periods){ if(Math.floor(s/1440)===d) out.push(fmt(s)+"–"+(e-s>=1440?"":"")+fmt(e)); }
  return out.length?out.join(", "):"Tutup";
}
function nowT(){const n=new Date();return n.getDay()*1440+n.getHours()*60+n.getMinutes();}
function km(a,b){const R=6371,r=x=>x*Math.PI/180;const dLa=r(b.lat-a.lat),dLo=r(b.lng-a.lng);const h=Math.sin(dLa/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
const mapsUrl = p => p.mapsUrl || ("https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(p.name+", "+(p.address?p.address+", ":"")+"Surabaya")+(p.placeId?"&query_place_id="+encodeURIComponent(p.placeId):""));
const routeUrl = p => "https://www.google.com/maps/dir/?api=1&destination="+p.lat+","+p.lng+(p.placeId?"&destination_place_id="+encodeURIComponent(p.placeId):"");
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let DATA = SEED.map(normalize);
let source = "seed";
try{const raw=localStorage.getItem("aicafe-data");if(raw){const arr=JSON.parse(raw);if(Array.isArray(arr)&&arr.length){DATA=arr.map(normalize);source="import";}}}catch(e){}

/* ---------- State ---------- */
const DEF = {cats:[],minRating:0,openMode:"any",day:new Date().getDay(),time:"21:00",area:"",near:"",radius:5,tags:[],price:0,sort:"rating",text:""};
let S = structuredClone(DEF);
let selected = null;
let shown = 60;

/* ---------- Filter UI ---------- */
const $ = id => document.getElementById(id);
function chipBtn(label,pressed,on,color){const b=document.createElement("button");b.type="button";b.className="chip";b.setAttribute("aria-pressed",pressed);b.innerHTML=(color?`<i style="background:${color}"></i>`:"")+esc(label);b.onclick=on;return b;}
function segBtns(el,opts,val,on){el.innerHTML="";for(const [v,l] of opts){const b=document.createElement("button");b.type="button";b.textContent=l;b.setAttribute("aria-pressed",String(v===val));b.onclick=()=>on(v);el.appendChild(b);}}
function buildFilters(){
  const cats = Object.keys(CATS);
  $("fCat").innerHTML="";
  cats.forEach(c=>$("fCat").appendChild(chipBtn((CATS[c].full?CATS[c].label+" Sedulur Tunggal Kopi":CATS[c].label)+" · "+DATA.filter(p=>p.category===c).length,String(S.cats.includes(c)),()=>{toggle(S.cats,c);update();},`var(--c-${c})`)));
  segBtns($("fRating"),[[0,"Semua"],[4,"4.0+"],[4.3,"4.3+"],[4.5,"4.5+"]],S.minRating,v=>{S.minRating=v;update();});
  $("ratingVal").textContent = S.minRating? "★ "+S.minRating.toFixed(1)+"+" : "";
  segBtns($("fOpenMode"),[["any","Kapan saja"],["now","Buka sekarang"],["at","Pilih jam"]],S.openMode,v=>{S.openMode=v;update();});
  $("openAtRow").hidden = S.openMode!=="at";
  $("fDay").value=S.day; $("fTime").value=S.time;
  $("fArea").value=S.area; $("fNear").value=S.near; $("fRadius").value=S.radius;
  $("fRadius").disabled=!S.near;
  $("radiusVal").textContent = S.near? "≤ "+S.radius+" km":"";
  $("fTags").innerHTML="";
  TAGS.forEach(t=>$("fTags").appendChild(chipBtn(t,String(S.tags.includes(t)),()=>{toggle(S.tags,t);update();})));
  segBtns($("fPrice"),[[0,"Semua"],[1,"Rp"],[2,"Rp Rp"],[3,"Rp Rp Rp+"]],S.price,v=>{S.price=v;update();});
  $("fSort").value=S.sort;
}
function toggle(arr,v){const i=arr.indexOf(v);i<0?arr.push(v):arr.splice(i,1);}
$("fDay").innerHTML = DAYS.map((d,i)=>`<option value="${i}">${d}</option>`).join("");
$("fArea").innerHTML = `<option value="">Seluruh Surabaya</option>`+AREAS.map(a=>`<option>${a}</option>`).join("");
$("fNear").innerHTML = `<option value="">Tidak dipakai</option>`+LANDMARKS.map(l=>`<option value="${l.id}">${l.name}</option>`).join("");
$("fDay").onchange=e=>{S.day=+e.target.value;update();};
$("fTime").onchange=e=>{S.time=e.target.value||"21:00";update();};
$("fArea").onchange=e=>{S.area=e.target.value;update();};
$("fNear").onchange=e=>{S.near=e.target.value;if(S.near&&S.sort==="rating")S.sort="dist";if(!S.near&&S.sort==="dist")S.sort="rating";update();};
$("fRadius").oninput=e=>{S.radius=+e.target.value;update();};
$("fSort").onchange=e=>{S.sort=e.target.value;update();};
$("resetBtn").onclick=()=>{S=structuredClone(DEF);update();};

/* ---------- Filtering ---------- */
function targetT(){ if(S.openMode==="now") return nowT(); if(S.openMode==="at") return S.day*1440+toMin(S.time); return null; }
function results(){
  const t=targetT(); const lm=LANDMARKS.find(l=>l.id===S.near);
  let r = DATA.map(p=>({...p,_dist: lm?km(lm,p):null}));
  r = r.filter(p=>{
    if(S.cats.length && !S.cats.includes(p.category)) return false;
    if(S.minRating && (p.rating==null || p.rating < S.minRating)) return false;
    if(t!=null && isOpenAt(p,t)!==true) return false;
    if(S.area && p.area!==S.area) return false;
    if(lm && p._dist>S.radius) return false;
    if(S.tags.some(tag=>!p.tags.includes(tag))) return false;
    if(S.price && (S.price===3 ? (p.price||0)<3 : p.price!==S.price)) return false;
    if(S.text){const hay=(p.name+" "+p.address+" "+p.tags.join(" ")).toLowerCase(); if(!S.text.split(/\s+/).every(w=>hay.includes(w))) return false;}
    return true;
  });
  const rv=p=>p.rating??-1;
  const sorters={rating:(a,b)=>rv(b)-rv(a)||b.reviews-a.reviews||(b.periods.length?1:0)-(a.periods.length?1:0),reviews:(a,b)=>b.reviews-a.reviews,name:(a,b)=>a.name.localeCompare(b.name),dist:(a,b)=>(a._dist??0)-(b._dist??0)||rv(b)-rv(a)};
  return r.sort(sorters[S.sort==="dist"&&!lm?"rating":S.sort]);
}

/* ---------- Render ---------- */
function priceLabel(n){return ["–","Murah","Sedang","Agak mahal","Mahal"][n||0];}
function ratingHtml(p){
  if(p.rating==null) return `<span style="color:var(--muted)">Belum ada rating</span>`;
  const src=p.rs==="perkiraan"?` <span title="Rating perkiraan AI" style="font-size:11px">(perkiraan)</span>`:"";
  return `<span class="stars">★ ${p.rating.toFixed(1)}</span><span>${p.reviews?p.reviews.toLocaleString("id-ID")+" ulasan":""}${src}</span>`;
}
function statusHtml(p){const o=isOpenAt(p,nowT());if(o===null)return `<span class="status">Jam tidak diketahui</span>`;return o?`<span class="status on">● Buka</span>`:`<span class="status off">● Tutup</span>`;}
function render(){
  buildFilters();
  const r=results();
  $("count").textContent=r.length;
  const af=[];
  if(S.text) af.push(`kata: "${S.text}"`);
  if(S.openMode==="now") af.push("buka sekarang");
  if(S.openMode==="at") af.push(`buka ${DAYS[S.day]} ${S.time}`);
  if(S.near) af.push(`≤ ${S.radius} km dari ${LANDMARKS.find(l=>l.id===S.near).name}`);
  $("activeFilters").innerHTML=af.map(a=>`<span>${esc(a)}</span>`).join("");
  $("list").innerHTML = r.length? r.slice(0,shown).map(p=>`
    <button class="card${selected===p.id?" sel":""}" data-id="${esc(p.id)}" type="button">
      <div class="card-top"><h3>${esc(p.name)}</h3><span class="cat" style="background:var(--c-${p.category})">${CATS[p.category].label}</span></div>
      <div class="meta">${ratingHtml(p)}${statusHtml(p)}${p._dist!=null?`<span class="dist">${p._dist.toFixed(1)} km</span>`:""}</div>
      <p class="addr">${esc(p.address||p.cuisine||"Alamat belum tercatat")}</p>
      <div class="tags">${p.tags.slice(0,5).map(t=>`<span>${esc(t)}</span>`).join("")}</div>
    </button>`).join("") : (S.cats.includes("stk")&&!DATA.some(p=>p.category==="stk")
     ? `<div class="empty">Data cabang <b>STK (Sedulur Tunggal Kopi)</b> belum ada di data contoh. Jalankan <span class="mono">fetch_places.py</span> lalu tekan <b>Impor data</b> untuk memuat semua cabang STK di Surabaya beserta lokasi, rating, dan jam bukanya.</div>`
     : `<div class="empty">Belum ada tempat yang cocok. Coba longgarkan filter jam atau rating, atau perbesar radius.</div>`);
  if(r.length>shown) $("list").insertAdjacentHTML("beforeend",`<button class="btn" id="moreBtn" type="button" style="grid-column:1/-1;justify-content:center">Tampilkan ${Math.min(60,r.length-shown)} lagi (sisa ${r.length-shown})</button>`);
  document.querySelectorAll(".card").forEach(c=>c.onclick=()=>openDetail(c.dataset.id));
  const mb=$("moreBtn"); if(mb) mb.onclick=()=>{shown+=60;render();};
  drawMap(r);
  $("datasetInfo").textContent = (source==="seed"?"":"Data impor · ")+DATA.length+" tempat";
  const nr=DATA.filter(p=>p.rating!=null).length, nh=DATA.filter(p=>p.periods.length).length;
  $("disclaimer").innerHTML = source==="seed"
   ? `<b>Sumber data.</b> ${DATA.length} tempat di Surabaya dari <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener" style="color:var(--kali)">© kontributor OpenStreetMap</a> (ODbL), ditambah daftar kurasi dari artikel JawaPos, detik, IDN Times, dan Mojok. ${nh} tempat punya jam buka tercatat, ${nr} punya rating (dari artikel atau perkiraan). Tempat tanpa jam tercatat tidak ikut muncul saat filter jam dipakai. Data ini belum mencakup semua usaha di Surabaya, jadi cek tombol <b>Google Maps</b> untuk info terbaru. Untuk rating dan jam buka lengkap dari Google, jalankan <span class="mono">fetch_places.py</span> lalu tekan <b>Impor data</b>.`
   : `<b>Data impor.</b> ${DATA.length} tempat dari file JSON yang kamu impor. <button class="reset" id="backSeed" type="button">Kembali ke data bawaan</button>`;
  const bs=$("backSeed"); if(bs) bs.onclick=()=>{try{localStorage.removeItem("aicafe-data")}catch(e){} DATA=SEED.map(normalize);source="seed";S=structuredClone(DEF);update();};
}
function update(){shown=60;render();}

/* ---------- Peta SVG ---------- */
const BB={w:112.60,e:112.82,n:-7.19,s:-7.35}, W=600,H=440;
const X=lng=>(lng-BB.w)/(BB.e-BB.w)*W, Y=lat=>(lat-BB.n)/(BB.s-BB.n)*H;
const pts=a=>a.map(([lng,lat])=>X(lng).toFixed(1)+","+Y(lat).toFixed(1)).join(" ");
const SEA=[[112.60,-7.19],[112.60,-7.197],[112.66,-7.200],[112.70,-7.204],[112.725,-7.200],[112.745,-7.206],[112.77,-7.215],[112.795,-7.232],[112.803,-7.255],[112.806,-7.285],[112.810,-7.32],[112.815,-7.35],[112.82,-7.35],[112.82,-7.19]];
const RIVER=[[112.722,-7.35],[112.728,-7.318],[112.736,-7.303],[112.741,-7.285],[112.746,-7.268],[112.742,-7.255],[112.737,-7.240],[112.734,-7.222],[112.733,-7.203]];
function drawMap(r){
  const svg=$("map");
  const grid=[];for(let i=1;i<6;i++){grid.push(`<line x1="${i*100}" y1="0" x2="${i*100}" y2="${H}" stroke="var(--line)" stroke-width=".6" stroke-dasharray="2 4"/>`);}
  for(let i=1;i<5;i++){grid.push(`<line x1="0" y1="${i*88}" x2="${W}" y2="${i*88}" stroke="var(--line)" stroke-width=".6" stroke-dasharray="2 4"/>`);}
  const areaLbl=[["UTARA",112.70,-7.225],["BARAT",112.645,-7.275],["PUSAT",112.725,-7.268],["TIMUR",112.775,-7.29],["SELATAN",112.715,-7.33]]
    .map(([t,lng,lat])=>`<text x="${X(lng)}" y="${Y(lat)}" font-size="11" font-weight="700" letter-spacing="3" opacity=".55">${t}</text>`).join("");
  const lms=LANDMARKS.map(l=>`<g opacity="${S.near===l.id?1:.7}"><rect x="${X(l.lng)-3}" y="${Y(l.lat)-3}" width="6" height="6" fill="var(--ink)" transform="rotate(45 ${X(l.lng)} ${Y(l.lat)})"/><text x="${X(l.lng)+7}" y="${Y(l.lat)+3}" font-size="9">${esc(l.name)}</text></g>`).join("");
  const lm=LANDMARKS.find(l=>l.id===S.near);
  const radius = lm ? `<circle cx="${X(lm.lng)}" cy="${Y(lm.lat)}" r="${S.radius/((BB.e-BB.w)*111.32*Math.cos(7.27*Math.PI/180))*W}" fill="var(--kali)" fill-opacity=".08" stroke="var(--kali)" stroke-dasharray="4 3"/>` : "";
  const pins=r.slice().reverse().map(p=>`<circle class="pin${selected===p.id?" sel":""}" data-id="${esc(p.id)}" cx="${X(p.lng).toFixed(1)}" cy="${Y(p.lat).toFixed(1)}" r="${selected===p.id?9:(r.length>150?3.6:6.5)}" fill="var(--c-${p.category})" stroke="var(--surface)" stroke-width="${r.length>150?1:2}"><title>${esc(p.name)}</title></circle>`).join("");
  svg.innerHTML=`<rect width="${W}" height="${H}" fill="var(--land)"/>${grid.join("")}
    <polygon points="${pts(SEA)}" fill="var(--sea)"/>
    <text x="${X(112.64)}" y="${Y(-7.193)+2}" font-size="9" font-style="italic">Selat Madura</text>
    <polyline points="${pts(RIVER)}" fill="none" stroke="var(--river)" stroke-width="3" stroke-linecap="round"/>
    <text x="${X(112.744)}" y="${Y(-7.312)}" font-size="9" font-style="italic">Kali Mas</text>
    ${areaLbl}${radius}${lms}${pins}
    <text x="${W-8}" y="${H-8}" font-size="9" text-anchor="end">Peta skematik · bukan skala navigasi</text>`;
  svg.querySelectorAll(".pin").forEach(c=>{
    c.onclick=()=>openDetail(c.dataset.id);
    c.onmouseenter=()=>{const p=DATA.find(x=>x.id===c.dataset.id);const box=$("mapbox").getBoundingClientRect(),cb=c.getBoundingClientRect();const tip=$("maptip");tip.textContent=p.name+(p.rating!=null?" · ★ "+p.rating.toFixed(1):"");tip.style.left=(cb.left-box.left+cb.width/2)+"px";tip.style.top=(cb.top-box.top)+"px";tip.hidden=false;};
    c.onmouseleave=()=>$("maptip").hidden=true;
  });
}
$("legend").innerHTML=Object.keys(CATS).map(c=>`<span><i style="background:var(--c-${c})"></i>${CATS[c].label}</span>`).join("")+`<span><i style="background:var(--ink);border-radius:0;transform:rotate(45deg);width:7px;height:7px"></i>Titik acuan</span>`;

      <table class="hours">${[1,2,3,4,5,6,0].map(d=>`<tr class="${d===today?"today":""}"><td>${DAYS[d]}</td><td>${p.periods.length?hoursForDay(p,d):"Belum tercatat"}</td></tr>`).join("")}</table>

    ${p.rs==="perkiraan"?`<p class="note"><b>Rating perkiraan.</b> Angka rating dan ulasan tempat ini disusun AI dan belum dicek ulang. Lihat Google Maps untuk angka terbaru.</p>`:""}
    <p style="font-size:12px;color:var(--muted);margin:0">Sumber: ${esc(p.src||"impor")}${p.rs==="artikel"?" · rating Google sesuai artikel":""}</p>`;
  $("detail").hidden=false; $("closeBtn").focus();

function closeDetail(){$("detail").hidden=true;}
$("detail").onclick=e=>{if(e.target.id==="detail")closeDetail();};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDetail();});
function toast(t){const el=$("toast");el.textContent=t;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,2200);}

/* ---------- Impor JSON ---------- */
$("importFile").onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{
    const arr=JSON.parse(await f.text()); const list=Array.isArray(arr)?arr:arr.places;
    if(!Array.isArray(list)||!list.length) throw new Error("kosong");
    const ok=list.filter(p=>p&&p.name&&typeof p.lat==="number"&&typeof p.lng==="number");
    if(!ok.length) throw new Error("format");
    DATA=ok.map(normalize); source="import"; S=structuredClone(DEF);
    try{localStorage.setItem("aicafe-data",JSON.stringify(ok));}catch(err){}
    update(); say(`Data baru dimuat: <b>${DATA.length}</b> tempat. Silakan tanya apa saja.`); toast("Impor berhasil");
  }catch(err){toast("File tidak terbaca. Pakai JSON dari fetch_places.py (butuh name, lat, lng).");}
  e.target.value="";
};

const SUGGEST=["STK buka sekarang","warkop 24 jam dekat ITS","cafe buat kerja ada wifi colokan","tempat makan legendaris rating 4.5","nongkrong jam 1 malam di Surabaya Timur","cafe estetik buat date","kuliner malam murah"];

function say(html,me){const d=document.createElement("div");d.className="msg "+(me?"me":"ai");d.innerHTML=html;$("chat").appendChild(d);$("chat").scrollTop=$("chat").scrollHeight;return d;}

function parse(q){
  const s=" "+q.toLowerCase().replace(/(\d)[,.](\d)/g,"$1#$2").replace(/[,.?!]/g," ").replace(/#/g,".")+" ";
  const f=structuredClone(DEF); const why=[];
  const has=(...w)=>w.some(x=>s.includes(x));
  // kategori
  const catMap={warkop:["warkop","warung kopi","cangkruk","ngopi murah"],cafe:[" cafe"," kafe","coffee","kopi kekinian","coffeeshop","coffee shop"],kedai:["kedai"],resto:["resto","restoran","rumah makan","makan","kuliner","depot","rawon","soto","sate","bebek","lontong"],stk:[" stk ","sedulur tunggal","sedulur kopi"]};
  for(const [c,ws] of Object.entries(catMap)) if(ws.some(w=>s.includes(w))) f.cats.push(c);
  if(has(" nongkrong","hangout","tempat ngopi")&&!f.cats.length){f.cats=["cafe","warkop","kedai"];}
  if(f.cats.length) why.push("jenis: "+f.cats.map(c=>CATS[c].label).join(", "));
  // rating
  let m=s.match(/(rating|bintang|★)\s*(di ?atas|minimal|min|>=?)?\s*(\d(?:[.,]\d)?)/);
  if(m){f.minRating=Math.min(5,parseFloat(m[3].replace(",",".")));why.push("rating ≥ "+f.minRating);}
  else if(has("terbaik","paling enak","rating tinggi","recommended","rekomen")){f.minRating=4.5;why.push("rating ≥ 4.5");}
  // waktu
  if(has("24 jam","nonstop","non stop")){f.tags.push("24 jam");why.push("buka 24 jam");}
  else if(has("sekarang","saat ini","lagi buka","masih buka")){f.openMode="now";why.push("buka sekarang");}
  else{
    let hour=null;
    const mj=s.match(/jam\s*(\d{1,2})(?:[.:](\d{2}))?\s*(pagi|siang|sore|malam|dini hari)?/);
    if(mj){hour=+mj[1];const mm=+(mj[2]||0);const per=mj[3];
      if(per==="malam"&&hour>=6&&hour<12)hour+=12; if(per==="sore"&&hour<12)hour+=12; if(per==="siang"&&hour<6)hour+=12;
      if(per==="malam"&&hour===12)hour=0;
      hour=hour%24; f.time=String(hour).padStart(2,"0")+":"+String(mm).padStart(2,"0");}
    else if(has("tengah malam")) f.time="00:30";
    else if(has("subuh","dini hari")) f.time="04:00";
    else if(has("pagi","sarapan")) f.time="07:30";
    else if(has("siang","makan siang")) f.time="12:00";
    else if(has("sore")) f.time="16:30";
    else if(has("malam","malem")) f.time="21:00";
    else hour=-1;
    if(hour!==-1){f.openMode="at";f.day=new Date().getDay();
      if(has("besok"))f.day=(f.day+1)%7;
      DAYS.forEach((d,i)=>{if(s.includes(d.toLowerCase()))f.day=i;});
      if(has("weekend","malam minggu")) f.day=6;
      why.push(`buka ${DAYS[f.day]} ${f.time}`);}
  }
  // lokasi
  const areaWords={Pusat:["pusat","tengah kota","tunjungan"],Utara:["utara","kenjeran","kembang jepun","perak"],Timur:["timur","sukolilo","mulyorejo","rungkut","gubeng","merr"],Selatan:["selatan","wonokromo","jemursari","ketintang","gayungan","wiyung"],Barat:["barat","citraland","citra land","darmo permai","sambikerep","lontar"]};
  const lmWords={its:["its"],unair:["unair","airlangga"],tp:["tunjungan plaza"," tp "],tugu:["tugu pahlawan"],gubeng:["stasiun gubeng"],bungkul:["bungkul"],galaxy:["galaxy","galmall"],royal:["royal plaza"],pakuwon:["pakuwon","pakuwon mall"],kenjeran:["kenjeran"]};
  for(const [id,ws] of Object.entries(lmWords)) if(ws.some(w=>s.includes(" "+w.trim()+" "))){f.near=id;f.sort="dist";const rm=s.match(/(\d{1,2})\s*km/);f.radius=rm?Math.min(15,+rm[1]):4;why.push(`≤ ${f.radius} km dari ${LANDMARKS.find(l=>l.id===id).name}`);break;}
  if(!f.near) for(const [a,ws] of Object.entries(areaWords)) if(ws.some(w=>s.includes(w))){f.area=a;why.push("wilayah "+a);break;}
  // fasilitas & suasana
  const tagWords={"wifi":["wifi","wi-fi","internet"],"colokan":["colokan","stopkontak","charger","ngecas"],"kerja":["kerja","wfc","nugas","belajar","laptop"],"outdoor":["outdoor","terbuka","taman","rooftop"],"ac":[" ac ","ber-ac","dingin"],"smoking area":["rokok","smoking","ngerokok"],"parkir luas":["parkir"],"murah":["murah","hemat","kantong mahasiswa","budget"],"instagramable":["estetik","aesthetic","instagram","foto","cantik"],"legendaris":["legendaris","legend","jadul","lawas"],"kuliner malam":["kuliner malam"],"specialty coffee":["specialty","manual brew","v60","single origin"],"rombongan":["rombongan","rame-rame","ramean","keluarga","bareng teman"],"heritage":["heritage","bersejarah","kolonial"],"date":["date","pacar","romantis","ngedate"]};
  for(const [t,ws] of Object.entries(tagWords)) if(ws.some(w=>s.includes(w))&&!f.tags.includes(t)){ if(t==="kerja"){f.tags.push("wifi");} else f.tags.push(t); }
  f.tags=[...new Set(f.tags)].filter(t=>DATA.some(p=>p.tags.includes(t))||t==="24 jam");
  if(f.tags.length) why.push("fasilitas: "+f.tags.join(", "));
  if(has("murah")&&!f.price){}
  if(has("mewah","fine dining","mahal")) {f.price=3;why.push("kelas atas");}
  // nama spesifik
  const GENERIC=["warkop","sentra","depot","rawon","kopi","soto","bebek","sate","lontong","rujak","warung","kedai","cafe","kya-kya"];
  const named=DATA.filter(p=>{const n=p.name.toLowerCase().replace(/[",.?!]/g,"").split(" —")[0].trim();return n.length>=8&&!GENERIC.includes(n)&&s.includes(" "+n+" ");}).sort((a,b)=>b.name.length-a.name.length)[0];
  return {f,why,named};
}
function ask(q){
  say(esc(q),true);
  const {f,why,named}=parse(q);
  if(named){S=structuredClone(DEF);update();say(`Ketemu: <button class="pick" data-id="${esc(named.id)}">${esc(named.name)} →</button>`);bindPicks();return;}
  S=f; let r=results(); let relaxed="";
  if(!r.length && S.tags.length){S.tags=[];r=results();relaxed=" Fasilitas yang kamu minta belum banyak tercatat, jadi syarat fasilitas saya lepas.";}
  if(!r.length && S.openMode!=="any"){S.openMode="any";r=results();relaxed+=" Jam buka banyak tempat belum tercatat, jadi syarat jam saya lepas. Cek jam di Google Maps ya.";}
  if(!r.length && S.minRating>0){S.minRating=0;r=results();relaxed+=" Syarat rating saya lepas supaya ada hasil.";}
  update();
  const tl= why.length? `<div class="tagline">${why.map(w=>`<span>${esc(w)}</span>`).join("")}</div>`:"";
  if(!r.length&&S.cats.includes("stk")&&!DATA.some(p=>p.category==="stk")){say(`Data cabang STK (Sedulur Tunggal Kopi) belum dimuat. Jalankan <b>fetch_places.py</b> lalu <b>Impor data</b>, nanti semua cabang STK di Surabaya muncul di sini.${tl}`);return;}
  if(!r.length){say(`Belum nemu yang cocok.${relaxed} Coba ganti jam atau wilayahnya, rek.${tl}`);return;}
  const top=r.slice(0,3).map(p=>`<button class="pick" data-id="${esc(p.id)}">${esc(p.name)}${p.rating!=null?` · ★ ${p.rating.toFixed(1)}`:""}${p._dist!=null?` · ${p._dist.toFixed(1)} km`:""} →</button>`).join("");
  say(`Ada <b>${r.length}</b> tempat yang cocok.${relaxed} Rekomendasi teratas:${top}${tl}`);
  bindPicks();
}
function bindPicks(){document.querySelectorAll(".msg .pick").forEach(b=>b.onclick=()=>openDetail(b.dataset.id));}

say(`Halo, rek! Mau nongkrong di mana? Ketik kebutuhanmu, misalnya <b>"warkop buka jam 2 malam dekat ITS"</b> atau <b>"cafe estetik rating 4.5 di Surabaya Barat"</b>. Filter di bawah akan menyesuaikan otomatis.`);
render();
</script>
